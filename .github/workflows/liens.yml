name: liens

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simuler sans rien publier"
        type: boolean
        default: true
      limite:
        description: "Nombre de salles (vide : toutes)"
        type: string
        default: ""

jobs:
  resoudre:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: liens
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund --silent
      - run: npx playwright install --with-deps chromium > /dev/null
      - name: Liens
        env:
          SOURCE: ${{ secrets.SOURCE }}
          TABLES: ${{ secrets.TABLES }}
          API: ${{ secrets.API }}
          CLE: ${{ secrets.CLE }}
        run: |
          set +e
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node src/liens.mjs ${{ inputs.limite && format('--limit {0}', inputs.limite) || '' }} > journal.txt 2>&1
          else
            node src/liens.mjs --publish ${{ inputs.limite && format('--limit {0}', inputs.limite) || '' }} > journal.txt 2>&1
          fi
          code=$?
          grep -E '^(::add-mask::|BILAN)' journal.txt
          exit $code
